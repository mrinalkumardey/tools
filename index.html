
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTools Hub - Authorized Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #error {
            color: #e53e3e;
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .admin-note {
            font-size: 0.8rem;
            color: #a0aec0;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Authorized Access Only</h2>
        <p>Enter your approved email to access FinTools Hub.</p>
        <input type="email" id="emailInput" placeholder="e.g., john.doe@gmail.com" required>
        <button onclick="checkAccess()">Enter</button>
        <p id="error">Access denied. Contact admin for approval.</p>
        <div class="admin-note">
            <small>Need access? Reply to this deploy or email mrinal@zohomail.in</small>
        </div>
    </div>

    <script>
        // Whitelist: Add your specific emails here (case-insensitive)
        const allowedEmails = [
            'mrinalkumardey@zohomail.in',  // Yours!
            'test.user@gmail.com',         // Example—swap with real ones
            'jane.doe@yahoo.com',
            // Add more as needed
        ];

        function checkAccess() {
            const email = document.getElementById('emailInput').value.toLowerCase().trim();
            const errorEl = document.getElementById('error');
            errorEl.style.display = 'none';

            if (!email) {
                errorEl.textContent = 'Please enter your email.';
                errorEl.style.display = 'block';
                return;
            }

            if (allowedEmails.includes(email)) {
                localStorage.setItem('auth', 'true');
                localStorage.setItem('userEmail', email);  // For personalization/watermarks
                localStorage.setItem('loginTime', Date.now());  // For 30-min expiry
                window.location.href = 'dashboard.html';  // Your homepage
            } else {
                errorEl.textContent = 'Access denied. Contact admin for approval.';
                errorEl.style.display = 'block';
            }
        }

        // Auto-redirect if already logged in
        if (localStorage.getItem('auth') === 'true' && isSessionValid()) {
            window.location.href = 'dashboard.html';
        }

        // Check session expiry (30 mins = 1800000 ms)
        function isSessionValid() {
            const loginTime = localStorage.getItem('loginTime');
            return loginTime && (Date.now() - parseInt(loginTime)) < 1800000;
        }

        // Enter key support
        document.getElementById('emailInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAccess();
        });
    </script>
</body>
</html>
