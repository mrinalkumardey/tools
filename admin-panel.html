<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BU Tool Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 1.8rem;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            color: #333;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .stat-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .content-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .filter-group select,
        .filter-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .filters {
                flex-direction: column;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Admin Panel</h1>
            <div class="header-buttons">
                <a href="dashboard.html" class="btn btn-secondary">← Back to Dashboard</a>
                <button class="btn btn-primary" onclick="exportToCSV()">📥 Export CSV</button>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <div class="icon">👥</div>
                <h3>Total Users</h3>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="icon">📊</div>
                <h3>Total Activities</h3>
                <div class="value" id="totalActivities">-</div>
            </div>
            <div class="stat-card">
                <div class="icon">📅</div>
                <h3>Today's Activities</h3>
                <div class="value" id="todayActivities">-</div>
            </div>
            <div class="stat-card">
                <div class="icon">🔥</div>
                <h3>Most Used Tool</h3>
                <div class="value" style="font-size: 1.2rem;" id="mostUsedTool">-</div>
            </div>
        </div>

        <div class="content-card">
            <h2 style="margin-bottom: 20px; color: #333;">Activity Logs</h2>
            
            <div class="filters">
                <div class="filter-group">
                    <label>Filter by User</label>
                    <select id="filterUser" onchange="applyFilters()">
                        <option value="">All Users</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Filter by Tool</label>
                    <select id="filterTool" onchange="applyFilters()">
                        <option value="">All Tools</option>
                        <option value="Dashboard">Dashboard</option>
                        <option value="Insurance Form Generator">Insurance Form Generator</option>
                        <option value="Loan Eligibility Calculator">Loan Eligibility Calculator</option>
                        <option value="Settlement Offer Letter">Settlement Offer Letter</option>
                        <option value="Overdue Notice Generator">Overdue Notice Generator</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Date From</label>
                    <input type="date" id="filterDateFrom" onchange="applyFilters()">
                </div>
                <div class="filter-group">
                    <label>Date To</label>
                    <input type="date" id="filterDateTo" onchange="applyFilters()">
                </div>
            </div>

            <div id="tableContainer">
                <div class="loading">Loading activity logs...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, limit, getDocs, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6LOUAmiHidHdAQB2WzTLR4cq7cs6h720",
            authDomain: "bu-tools-dashboard.firebaseapp.com",
            projectId: "bu-tools-dashboard",
            storageBucket: "bu-tools-dashboard.firebasestorage.app",
            messagingSenderId: "856733218195",
            appId: "1:856733218195:web:3bf4794d70ecd04eb3a466"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let allActivities = [];
        let filteredActivities = [];

        // Check authentication
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
            } else {
                await loadActivityLogs();
            }
        });

        async function loadActivityLogs() {
            try {
                const q = query(collection(db, 'activity_logs'), orderBy('timestamp', 'desc'), limit(500));
                const querySnapshot = await getDocs(q);
                
                allActivities = [];
                const users = new Set();
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    allActivities.push({
                        id: doc.id,
                        ...data,
                        timestamp: data.timestamp?.toDate() || new Date()
                    });
                    users.add(data.userEmail);
                });

                // Populate user filter
                const userFilter = document.getElementById('filterUser');
                users.forEach(email => {
                    const option = document.createElement('option');
                    option.value = email;
                    option.textContent = email;
                    userFilter.appendChild(option);
                });

                filteredActivities = [...allActivities];
                updateStats();
                displayActivities();
            } catch (error) {
                console.error('Error loading activities:', error);
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <h3>Error loading activity logs</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            // Total unique users
            const uniqueUsers = new Set(allActivities.map(a => a.userId)).size;
            document.getElementById('totalUsers').textContent = uniqueUsers;

            // Total activities
            document.getElementById('totalActivities').textContent = allActivities.length;

            // Today's activities
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayCount = allActivities.filter(a => a.timestamp >= today).length;
            document.getElementById('todayActivities').textContent = todayCount;

            // Most used tool
            const toolCounts = {};
            allActivities.forEach(a => {
                if (a.toolName !== 'Dashboard') {
                    toolCounts[a.toolName] = (toolCounts[a.toolName] || 0) + 1;
                }
            });
            const mostUsed = Object.entries(toolCounts).sort((a, b) => b[1] - a[1])[0];
            document.getElementById('mostUsedTool').textContent = mostUsed ? mostUsed[0].substring(0, 20) : 'N/A';
        }

        function displayActivities() {
            const container = document.getElementById('tableContainer');
            
            if (filteredActivities.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No activities found</h3>
                        <p>No activity logs match your filters</p>
                    </div>
                `;
                return;
            }

            let tableHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>User</th>
                            <th>Tool</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filteredActivities.forEach(activity => {
                const date = activity.timestamp;
                const formattedDate = date.toLocaleString('en-IN', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const toolBadge = activity.toolName === 'Dashboard' 
                    ? '<span class="badge badge-info">Dashboard</span>'
                    : '<span class="badge badge-success">' + activity.toolName + '</span>';

                tableHTML += `
                    <tr>
                        <td>${formattedDate}</td>
                        <td>${activity.userEmail}</td>
                        <td>${toolBadge}</td>
                        <td>${activity.action}</td>
                    </tr>
                `;
            });

            tableHTML += '</tbody></table>';
            container.innerHTML = tableHTML;
        }

        window.applyFilters = function() {
            const userFilter = document.getElementById('filterUser').value;
            const toolFilter = document.getElementById('filterTool').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;

            filteredActivities = allActivities.filter(activity => {
                if (userFilter && activity.userEmail !== userFilter) return false;
                if (toolFilter && activity.toolName !== toolFilter) return false;
                
                if (dateFrom) {
                    const fromDate = new Date(dateFrom);
                    fromDate.setHours(0, 0, 0, 0);
                    if (activity.timestamp < fromDate) return false;
                }
                
                if (dateTo) {
                    const toDate = new Date(dateTo);
                    toDate.setHours(23, 59, 59, 999);
                    if (activity.timestamp > toDate) return false;
                }
                
                return true;
            });

            displayActivities();
        };

        window.exportToCSV = function() {
            if (filteredActivities.length === 0) {
                alert('No data to export');
                return;
            }

            let csv = 'Timestamp,User Email,Tool Name,Action\n';
            
            filteredActivities.forEach(activity => {
                const date = activity.timestamp.toLocaleString('en-IN');
                csv += `"${date}","${activity.userEmail}","${activity.toolName}","${activity.action}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `activity_logs_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(url);
        };
    </script>
</body>
</html>
